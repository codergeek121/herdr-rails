id = "codergeek121.herdr-rails"
name = "Herdr Rails"
version = "0.3.0"
min_herdr_version = "0.7.0"
description = "Simplify Rails development with Herdr"
platforms = ["linux", "macos"]

[[events]]
on = "worktree.created"
command = ["sh", "bin/db_prepare.sh"]

[[events]]
on = "worktree.created"
command = ["sh", "bin/javascript_install.sh"]

[[events]]
on = "worktree.created"
command = ["sh", "bin/css_install.sh"]

[[actions]]
id = "dev-layout"
title = "Dev-Layout: Editor + Rails + Terminal"
contexts = ["workspace", "tab", "pane"]
command = ["sh", "bin/railsdev_layout.sh"]
